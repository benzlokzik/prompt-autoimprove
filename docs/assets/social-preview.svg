<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="prompt-autoimprove — automatic prompt improvement for LLMs and multimodal models">
  <defs>
    <linearGradient id="sp-canvas" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1330"/>
      <stop offset="0.55" stop-color="#241946"/>
      <stop offset="1" stop-color="#14101F"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="640" cy="250" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pa-bg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#1E1635"/>
    </linearGradient>
    <linearGradient id="pa-sl" x1="23" y1="51" x2="41" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FACC15"/>
      <stop offset="0.55" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FEF9C3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-canvas)"/>
  <rect width="1280" height="640" fill="url(#sp-glow)"/>

  <!-- logo mark, native 64x64 scaled 2.6x and centered horizontally -->
  <g transform="translate(556.8, 120) scale(2.6)">
    <rect width="64" height="64" rx="15" fill="url(#pa-bg)"/>
    <path d="M8 32 A24 24 0 0 1 56 32" stroke="#C4B5FD" stroke-width="0.7" fill="none" opacity="0.45"/>
    <path d="M56 32 A24 24 0 0 1 8 32" stroke="#FACC15" stroke-width="0.7" fill="none" opacity="0.4"/>
    <circle cx="8" cy="32" r="1" fill="#C4B5FD" opacity="0.8"/>
    <circle cx="56" cy="32" r="1" fill="#FACC15" opacity="0.75"/>
    <path d="M22 16H15v32h7" stroke="#F8FAFC" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 16h7v32h-7" stroke="#F8FAFC" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M41 13L23 51" stroke="url(#pa-sl)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M40.2 13.5 L22.2 51.5" stroke="#FFFFFF" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M51 9 L52 13.5 L56.5 14.5 L52 15.5 L51 20 L50 15.5 L45.5 14.5 L50 13.5 Z" fill="#FEF9C3"/>
    <circle cx="13" cy="55" r="0.9" fill="#FACC15" opacity="0.75"/>
  </g>

  <text x="640" y="430" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'DejaVu Sans Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="76" font-weight="500" letter-spacing="-1.5"
        fill="#F5F0FF">prompt<tspan fill="#C4B5FD">-</tspan>autoimprove</text>

  <text x="640" y="498" text-anchor="middle"
        font-family="ui-sans-serif, 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="400" letter-spacing="0.2"
        fill="#C4B5FD">Automatic prompt improvement for LLMs and multimodal models</text>
</svg>
