site_name: prompt-autoimprove
site_url: https://benzlokzik-university.github.io/prompt-autoimprove/
site_description: Automatic prompt improvement for LLMs and multimodal models
site_author: benzlokzik

repo_url: https://github.com/benzlokzik-university/prompt-autoimprove
repo_name: benzlokzik-university/prompt-autoimprove
edit_uri: edit/main/docs/

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.action.view
    - content.action.edit
    - content.tooltips

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Strategies: strategies.md
  - Scoring: scoring.md
  - CLI: cli.md
  - Frontend: frontend.md
  - Local models: local-models.md

markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: ""
  - smarty:
      smart_quotes: false
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.saneheaders
  - pymdownx.fancylists:
      inject_style: true
  - pymdownx.magiclink:
      repo_url_shorthand: true
      social_url_shorthand: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __codeline
      line_anchors: __codelineno
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang:
        - en
        - ru
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
          nav_translations:
            Home: Home
            Architecture: Architecture
            Strategies: Strategies
            Scoring: Scoring
            CLI: CLI
            Frontend: Frontend
            Local models: Local models
        - locale: ru
          name: Русский
          build: true
          link: /ru/
          site_description: Автоматическое улучшение промптов для LLM и мультимодальных моделей
          nav_translations:
            Home: Главная
            Architecture: Архитектура
            Strategies: Стратегии
            Scoring: Оценка
            CLI: CLI
            Frontend: Фронтенд
            Local models: Локальные модели
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/benzlokzik
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/anrie-abrahamyan
      name: LinkedIn
    - icon: simple/huggingface
      link: https://huggingface.co/benzlokzik
      name: Hugging Face
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0003-1848-1674
      name: ORCID
    - icon: fontawesome/solid/globe
      link: https://epops.space
      name: Website
  generator: false

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
