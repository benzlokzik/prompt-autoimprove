services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pai
      POSTGRES_PASSWORD: pai
      POSTGRES_DB: pai
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pai"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --reserve-memory=0M
      - --memory=512M
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pai
      MINIO_ROOT_PASSWORD: paipaipai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: .
    image: prompt-autoimprove:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAI_DB__DSN: postgresql+asyncpg://pai:pai@postgres:5432/pai
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    image: prompt-autoimprove:dev
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PAI_DB__DSN: postgresql+asyncpg://pai:pai@postgres:5432/pai
      PAI_KAFKA__BOOTSTRAP_SERVERS: redpanda:9092
      PAI_KAFKA__ENABLED: "true"
      PAI_API__API_KEY: dev-key
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: prompt-autoimprove-frontend:dev
    depends_on:
      app:
        condition: service_healthy
    environment:
      PAI_BACKEND_URL: http://app:8000
      PAI_REFLEX_API_URL: http://localhost:8001
      PAI_API_KEY: dev-key
    ports:
      - "3000:3000"
      - "8001:8001"

  ollama:
    image: ollama/ollama:latest
    profiles: ["models"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  minio_data:
  ollama_data:
