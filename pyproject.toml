[project]
name = "prompt-autoimprove"
version = "0.1.0"
description = "Microservices system for automatic improvement of LLM prompts"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "benzlokzik" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "aiokafka>=0.14.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "slowapi>=0.1.9",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "typer>=0.25.1",
    "sse-starlette>=3.4.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "prek>=0.0.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "respx>=0.21",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-static-i18n>=1.3.0",
]
frontend = [
    "reflex>=0.9.2.post1",
]
ml = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.2",
]
local-models = [
    "llama-cpp-python>=0.3",
]

[project.scripts]
pai = "prompt_autoimprove.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_autoimprove"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [
    "src/prompt_autoimprove/api/grpc/generated",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF",
    "PL", "PTH", "ARG", "TC", "ASYNC", "C4", "DTZ",
]
ignore = ["PLR0913", "PLR2004", "PLW0603", "N818", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101"]
"frontend/**" = ["RUF012", "BLE001"]
"frontend/prompt_autoimprove_ui/i18n.py" = ["RUF001", "RUF002", "RUF003"]
"src/prompt_autoimprove/api/grpc/**" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
include = ["src"]
exclude = [
    "src/prompt_autoimprove/api/grpc/generated",
    "src/prompt_autoimprove/adapters/gguf_local.py",
    "src/prompt_autoimprove/adapters/safetensors_hf.py",
    "src/prompt_autoimprove/core/ml_complexity.py",
    "src/prompt_autoimprove/api/grpc/service.py",
    "src/prompt_autoimprove/api/grpc/server.py",
]

[tool.ty.rules]
unresolved-import = "warn"
invalid-argument-type = "warn"
missing-argument = "error"
unknown-argument = "error"
invalid-assignment = "warn"

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.alembic]
script_location = "src/prompt_autoimprove/persistence/migrations"
prepend_sys_path = ["."]
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s"
timezone = "UTC"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "console_scripts"
entrypoint = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
