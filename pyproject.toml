[project]
name = "prompt-autoimprove"
version = "0.1.0"
description = "Microservices system for automatic improvement of LLM prompts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "benzlokzik" }]
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "prek>=0.0.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_autoimprove"]
