[project]
name = "prompt-autoimprove"
version = "0.1.0"
description = "Microservices system for automatic improvement of LLM prompts"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "benzlokzik" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "aiokafka>=0.14.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "slowapi>=0.1.9",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "typer>=0.25.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "prek>=0.0.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "respx>=0.21",
]

[project.scripts]
pai = "prompt_autoimprove.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_autoimprove"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF",
    "PL", "PTH", "ARG", "TCH", "ASYNC", "C4", "DTZ",
]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-import = "error"
invalid-argument-type = "error"
missing-argument = "error"
unknown-argument = "error"

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
